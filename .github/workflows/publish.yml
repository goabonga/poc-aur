name: publish

# Bumps one component's PKGBUILD to a released poc-app version, builds it
# for real against the actual GitHub release tarball, publishes the result
# as a poc-aur release (a stable URL regardless of AUR configuration), and
# - when an AUR SSH deploy key is configured - pushes PKGBUILD + .SRCINFO to
# that package's AUR git repository. Reports back to poc-app either way.
# Can be run by hand, but is normally dispatched by poc-app's release
# workflow right after it tags a release.

on:
  workflow_dispatch:
    inputs:
      component:
        description: poc-app component to package
        required: true
        type: choice
        options: [greeter, pinger]
      version:
        description: upstream version (must already be tagged "<component>-v<version>" on poc-app)
        required: true
        type: string

jobs:
  publish:
    name: publish (${{ inputs.component }} ${{ inputs.version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Bump pkgver
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ inputs.version }}/" packages/${{ inputs.component }}/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packages/${{ inputs.component }}/PKGBUILD

      - name: Fetch poc-app's release archive
        # poc-app is a private repo, and makepkg's DLAGENTS curl call has no
        # way to take a bearer token (confirmed for real: it doesn't pass
        # -n/--netrc, so a .netrc is silently ignored). Pre-placing the file
        # under the name source=() expects is makepkg's own documented way
        # to skip its own fetch - `updpkgsums`/`makepkg` both just find it.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -o "packages/${{ inputs.component }}/poc-app-${{ inputs.version }}.tar.gz" \
            "https://github.com/goabonga/poc-app/archive/refs/tags/${{ inputs.component }}-v${{ inputs.version }}.tar.gz"

      - name: Recompute checksums, regenerate .SRCINFO and build for real
        run: |
          docker run --rm -v "$PWD/packages/${{ inputs.component }}":/pkg -w /pkg archlinux:base-devel bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed base-devel pacman-contrib go >/dev/null
            useradd -m builder
            chown -R builder:builder /pkg
            runuser -u builder -- updpkgsums
            runuser -u builder -- makepkg --printsrcinfo > /pkg/.SRCINFO
            runuser -u builder -- makepkg -s --noconfirm
          '
          rm -f packages/${{ inputs.component }}/poc-app-${{ inputs.version }}.tar.gz

      - name: Publish the built package as a poc-aur release
        # A stable fallback download URL for the callback below,
        # independent of whether an AUR deploy key is configured.
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.component }}-v${{ inputs.version }}"
          pkgfile=$(ls packages/${{ inputs.component }}/*.pkg.tar.zst)
          # Pull this release's actual notes out of multicz's own
          # per-component CHANGELOG.md - makepkg leaves the extracted
          # upstream source under src/ after a build.
          changelog_md="packages/${{ inputs.component }}/src/poc-app-${{ inputs.component }}-v${{ inputs.version }}/cmd/${{ inputs.component }}/CHANGELOG.md"
          notes=$(awk -v ver="${{ inputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture && /^- /    { print }
          ' "$changelog_md")
          if [ -z "$notes" ]; then
            notes="New upstream release: poc-app $tag."
          fi
          gh release create "$tag" "$pkgfile" --title "$tag" \
            --notes "$notes" \
            --repo "${{ github.repository }}"
          url=$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json assets -q ".assets[0].browser_download_url")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Commit the updated recipe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/${{ inputs.component }}/PKGBUILD packages/${{ inputs.component }}/.SRCINFO
          git commit -m "chore(${{ inputs.component }}): bump to ${{ inputs.version }}" || echo "nothing to commit"
          git push

      - name: Check AUR deploy key availability
        id: aur
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::secrets.AUR_SSH_KEY unset; built and committed locally only, not pushed to the AUR"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to the AUR
        if: steps.aur.outputs.available == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -m 600 /dev/stdin ~/.aur_ssh_key <<<"$AUR_SSH_KEY"
          export GIT_SSH_COMMAND="ssh -i ~/.aur_ssh_key -o StrictHostKeyChecking=accept-new"
          repo="$(mktemp -d)"
          git clone "ssh://aur@aur.archlinux.org/poc-${{ inputs.component }}.git" "$repo"
          cp packages/${{ inputs.component }}/PKGBUILD packages/${{ inputs.component }}/.SRCINFO "$repo/"
          cd "$repo"
          git config user.name "Chris"
          git config user.email "goabonga@pm.me"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "nothing to push"; exit 0; }
          git commit -m "${{ inputs.component }}-v${{ inputs.version }}"
          git push origin HEAD:master

      - name: Report back to poc-app
        # CROSS_REPO_TOKEN is the same fine-grained PAT poc-app uses to
        # trigger this workflow, with Contents (read/write) on poc-app too
        # so it can fire this repository_dispatch. Links the real AUR page
        # once pushed there; falls back to this run's poc-aur release
        # otherwise.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          if [ "${{ steps.aur.outputs.available }}" = "true" ]; then
            url="https://aur.archlinux.org/packages/poc-${{ inputs.component }}"
          else
            url="${{ steps.github_release.outputs.url }}"
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-published \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[kind]=aur" \
            -f "client_payload[url]=$url"

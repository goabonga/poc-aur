name: publish

# Placeholder publish pipeline: reports a fake download URL back to poc-app
# instead of actually building. The real build (packages/<component>/PKGBUILD)
# works - verified end-to-end for real against the actual private poc-app
# repo - but the environment quirks around it (Docker UID/chown, the
# makepkg -debug package, fine-grained PAT auth) made the cross-repo
# dispatch + callback loop itself slow to validate. This isolates that loop
# from the build while it's being exercised on its own; swap the "Fake
# publish" step back for the real build steps (see git history on this
# file) once the loop is solid.
# Can be run by hand, but is normally dispatched by poc-app's release
# workflow right after it tags a release.

on:
  workflow_dispatch:
    inputs:
      component:
        description: poc-app component to package
        required: true
        type: choice
        options: [greeter, pinger]
      version:
        description: upstream version (must already be tagged "<component>-v<version>" on poc-app)
        required: true
        type: string

jobs:
  publish:
    name: publish (${{ inputs.component }} ${{ inputs.version }})
    runs-on: ubuntu-24.04
    steps:
      - name: Fake publish
        id: fake
        run: |
          echo "url=https://example.invalid/poc-aur/poc-${{ inputs.component }}-${{ inputs.version }}-1-x86_64.pkg.tar.zst" >> "$GITHUB_OUTPUT"

      - name: Report back to poc-app
        # CROSS_REPO_TOKEN is the same fine-grained PAT poc-app uses to
        # trigger this workflow, with Contents (read/write) on poc-app too
        # so it can fire this repository_dispatch.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-published \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[kind]=aur" \
            -f "client_payload[url]=${{ steps.fake.outputs.url }}"
